name: sites
# Web Studio build check: every site in sites/ is validated, built from its vetted template (lockfile, no install scripts) and QA-checked
# (content rules, CASL form, no external scripts, no template leftovers). Read-only token, no secrets; nothing is deployed from CI.
on:
  pull_request:
    paths: ["sites/**", "hq_webstudio.py", "test_hq_webstudio.py", ".github/workflows/sites.yml"]
  push:
    branches: ["overnight-build"]
    paths: ["sites/**", "hq_webstudio.py"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.3"
      - name: Template dependencies (lockfile, no install scripts)
        run: cd sites/_templates/astrowind && npm ci --ignore-scripts --no-audit --no-fund
      - name: Web Studio tests (incl. a real build of every site)
        env:
          TELEGRAM_BOT_TOKEN: test
        run: python3 -m unittest -v test_hq_webstudio
      - name: Build and QA every site
        run: |
          set -euo pipefail
          for f in sites/*/site.json; do
            slug=$(basename "$(dirname "$f")")
            case "$slug" in _*) continue;; esac
            python3 hq_webstudio.py check "$slug"
            python3 hq_webstudio.py build "$slug" --out "$RUNNER_TEMP/site-$slug"
          done
