name: tests
# Every check is one script: scripts/gate.sh. Run the same command locally (see DEV_GATE.md), so CI and local cannot diverge.
# Job names `unit` and `migrations` are kept because branch protection / DEPLOY_RUNBOOK.md refer to them. Do not rename them.
# Hardening (HARDENING_NOTES.md): actions pinned by commit SHA (scripts/check_workflow_pins.py enforces it), least-privilege token,
# no persisted git credentials, hash-verified Python deps (requirements/dev.lock), timeouts, one run per ref.
on:
  pull_request:
  push:
    branches: ["jarvis/**", "overnight-build", "stream/**"]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    # fast feedback, no database: repo tests, lint/manifest tests, migration lint, bundle freshness, workflow pin check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # the migration lint compares against origin/overnight-build
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/dev.lock
      - run: python3 scripts/check_workflow_pins.py
      - run: python3 scripts/check_gitleaks_ignore.py
      - run: scripts/gate.sh --only unit,scripts-tests,lint,bundle,appcheck,webjs
  migrations:
    # the full gate: everything in `unit` plus the replica run (migrations, e2e, integration, rollback drill), the generated
    # function manifest, and the backup drill when the branch has one. --strict: a skipped required step is a failure.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: pw }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      # psycopg2-binary and cryptography are in the lock (runtime.in), so no ad-hoc installs
      - run: pip install --require-hashes -r requirements/dev.lock
      - name: Full gate
        env:
          PGPASSWORD: pw
          REPLICA_URL: postgresql://postgres:pw@localhost:5432/postgres
        run: scripts/gate.sh --strict
  secret-scan:
    # gitleaks over the full history of every ref the checkout fetched, then over the PR's own commits. Config: .gitleaks.toml.
    # Binary pinned by version and verified by sha256 (no third-party action, no licence key).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard the suppression list (exact audited fingerprints only, no commit/dir/rule-wide allowlists)
        run: python3 scripts/check_gitleaks_ignore.py
      - name: Install gitleaks (sha256 verified)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/glbin" && tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP/glbin" gitleaks
          echo "$RUNNER_TEMP/glbin" >> "$GITHUB_PATH"
      - name: Scan full history (all fetched refs)
        run: gitleaks git --no-banner --redact=100 --exit-code 1 -c .gitleaks.toml --log-opts="--all" .
      - name: Scan this PR's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --no-banner --redact=100 --exit-code 1 -c .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}" .
