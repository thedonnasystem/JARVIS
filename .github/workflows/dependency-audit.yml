name: dependency-audit
# Known-vulnerability scan of the hash-pinned locks (pip-audit, OSV/PyPI advisory data). Separate workflow and job name so the
# required checks `unit` and `migrations` are untouched. Weekly schedule catches advisories published after the lock was made.
on:
  pull_request:
    paths: ["requirements/**", ".github/workflows/dependency-audit.yml"]
  push:
    branches: ["overnight-build"]
    paths: ["requirements/**"]
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r requirements/dev.lock
      - name: pip-audit runtime lock (blocking)
        run: pip-audit -r requirements/runtime.lock --require-hashes --disable-pip --no-deps --strict
      - name: pip-audit dev lock (blocking)
        run: pip-audit -r requirements/dev.lock --require-hashes --disable-pip --no-deps --strict
