# One-shot production database release, Chairman-authorized (Nov 17 2026; hands v1 Nov 18 2026; FFM engine + execution Nov 19 2026).
# Runs only on a push to branch release/prod-db, and only does anything when the
# repository secret PROD_DB_URL exists. Applies, in APPLY_ORDER, every migration
# file from START_AT onward that is not yet in supabase_migrations.schema_migrations,
# one file per transaction, stopping at the first error. Records each file in the
# Supabase migration ledger with the same name style used so far (file name without
# the date prefix and .sql). Never prints the secret. Delete the secret afterwards.
name: prod-db-release
on:
  push:
    branches: [release/prod-db]
permissions:
  contents: read
concurrency:
  group: prod-db-release
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
      START_AT: 20261125_ffm_engine_v1.sql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require the secret
        run: |
          if [ -z "$PROD_DB_URL" ]; then echo "::error::PROD_DB_URL secret not set; nothing done."; exit 1; fi; echo "::notice::PROD_DB_URL present"
      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Preflight (read-only)
        run: |
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -At -c "select 'last_migration=' || (select name from supabase_migrations.schema_migrations order by version desc limit 1)" \
            -c "select 'kill_switch=' || kill_switch || ' mode=' || mode || ' cap=' || daily_spend_cap_cents from public.system_state limit 1"
      - name: Apply pending migrations in order
        run: |
          set -euo pipefail
          started=0
          while IFS= read -r f; do
            f="${f%%#*}"; f="$(echo "$f" | xargs)"; [ -z "$f" ] && continue
            if [ "$f" = "$START_AT" ]; then started=1; fi
            [ "$started" = 1 ] || continue
            name="$(echo "$f" | sed -E 's/^[0-9]{8}_//; s/\.sql$//')"
            done_already="$(psql "$PROD_DB_URL" -At -c "select count(*) from supabase_migrations.schema_migrations where name = '$name'")"
            if [ "$done_already" != "0" ] && [ "$name" != "lockdown_v1" ]; then echo "skip (already applied): $f"; continue; fi
            if [ "$name" = "lockdown_v1" ]; then
              n_after="$(psql "$PROD_DB_URL" -At -c "select count(*) from supabase_migrations.schema_migrations where name = 'lockdown_v1' and version > (select max(version) from supabase_migrations.schema_migrations where name = 'insurance_classifier_v1')")"
              if [ "$n_after" != "0" ]; then echo "skip (lockdown re-run already done): $f"; continue; fi
            fi
            echo "applying: $f"
            ver="$(date -u +%Y%m%d%H%M%S)"
            { echo "begin;"; cat "migrations/$f"; echo; \
              echo "insert into supabase_migrations.schema_migrations(version, name, statements) values ('$ver', '$name', array[\$jarvis_release\$$(cat "migrations/$f")\$jarvis_release\$]);"; \
              echo "commit;"; } > /tmp/apply.sql
            psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -q -f /tmp/apply.sql
            echo "applied: $f"
            sleep 1
          done < migrations/APPLY_ORDER.txt
          [ "$started" = 1 ] || { echo "START_AT not found in APPLY_ORDER"; exit 1; }
      - name: Verify (read-only)
        run: |
          psql "$PROD_DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "select 'last_migration=' || (select name from supabase_migrations.schema_migrations order by version desc limit 1)" \
            -c "select 'kill_switch=' || kill_switch || ' mode=' || mode || ' cap=' || daily_spend_cap_cents from public.system_state limit 1" \
            -c "select 'executors=' || count(*) from public.executor_registry" \
            -c "select 'jarvis_core_config=' || row_to_json(c)::text from public.jarvis_core_config c" \
            -c "select 'anon_auth_exec=' || count(*) from information_schema.routine_privileges where routine_schema='public' and grantee in ('anon','authenticated')"
