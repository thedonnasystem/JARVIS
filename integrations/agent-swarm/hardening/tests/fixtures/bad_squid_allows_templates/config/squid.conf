# Egress allow-list: HTTPS CONNECT to exactly one model API host. Everything else is denied.
# This file is the single place the allow-list lives. verify_swarm_controls.py parses it.
http_port 3128
acl model_api dstdomain api.anthropic.com templates.agent-swarm.dev proxy.desplega.sh
acl tls_port port 443
acl is_connect method CONNECT
http_access allow is_connect model_api tls_port
http_access deny all
# Explicitly named for the audit trail; they are already denied by the line above.
#   models.dev  proxy.desplega.sh  templates.agent-swarm.dev  app.agent-swarm.dev  statsig.anthropic.com  sentry.io
cache deny all
via off
forwarded_for delete
pid_filename none
access_log stdio:/dev/stdout
cache_log /dev/stderr
